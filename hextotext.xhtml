<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <meta name="title" content="Hex to Text and vice versa converter" />
  <title>HEX &harr; TEXT</title>
  <link rel="stylesheet" href="style.css" type="text/css" media="all" />
</head>
<body>
  <h2>Hexadecimal &harr; Normal text converter</h2>
  <div class="container">
    <div>
      <label for="textInput">Plain text:</label>
      <textarea id="textInput" placeholder="type here..." />
    </div>
    <div>
      <label for="hexInput">Hexadecimal:</label>
      <textarea id="hexInput" placeholder="type here... (bytes separated with space)" />
    </div>
    <script src="script.js" type="text/javascript" />
</body>
</html>
