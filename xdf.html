<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="title" content="XDF guide">
  <title>XDF</title>
  <link rel="stylesheet" href="style.css" type="text/css" media="all">
</head>
<body>
  <doc-title>XML Document Format</doc-title>
  <p style="font-family: 'Arial', 'Helvetica', sans-serif;">
    <black-text>XDF</black-text>
    (<extra-bold>X</extra-bold>ML <extra-bold>D</extra-bold>ocument <extra-bold>F</extra-bold>ormat)
    is an XML variant designed for basic PDF/DOC/RTF/ODT-like documents.
    <br>here is a basic XDF document...:
  </p>
  <object data="inputxdf.xml" type="text/plain" width="50%" height="500px">
    <p>Your browser does not support embedded objects.</p>
    <a href="inputxdf.xml">view the file here</a><br>or
    <a href="inputxdf.xml" download>download it here</a>
  </object>
  <p>...and here is it's output:</p>
  <object data="outputxdf.pdf" type="application/pdf" width="50%" height="500px">
    <p>Your browser does not support embedded objects.</p>
    <a href="outputxdf.pdf">view the file here</a><br>or
    <a href="outputxdf.pdf" download>download it here</a>
  </object>
  <script src="script.js"></script>
</body>
</html>
